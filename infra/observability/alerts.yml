# One Melody - production ke alert rules, Uptrace ke YAML monitor format me.
#
# Import kaise karein: Uptrace → Alerting → Monitors → New monitor → "From YAML", aur EK
# monitor entry paste karo (ya poori list, agar aapka Uptrace version le leta hai).
# Har alert ka matlab aur pehle kya check karna hai: infra/observability/README.md
#
# ─────────────────────────────────────────────────────────────────────────────
# NOTIFICATION CHANNEL - abhi set NAHI hua (placeholder)
#   Abhi koi email/Slack destination nahi chuna gaya. Jab tak
#   Uptrace → Alerting → Notification channels me ek banake in monitors se joda nahi jaata,
#   alerts sirf Uptrace UI me dikhenge. README.md ka "Connecting a channel" dekho.
#   notification_channel: TODO_CHOOSE_EMAIL_OR_SLACK
# ─────────────────────────────────────────────────────────────────────────────
#
# Niyam (conventions)
# - Uptrace OTel naamon me dot ki jagah underscore likhta hai: http.server.request.duration →
#   http_server_request_duration, service.name → service_name.
# - Har 1 minute pe check hota hai, to num_eval_points = window ke minutes;
#   min_breach_points = num_eval_points matlab "window ka har minute limit ke paar tha".
# - Service naam OTEL_SERVICE_NAME se aate hain: core-engine, admin-backend,
#   audio-processing, mail-worker.
# - Metrics kahan se aate hain:
#     uptrace_tracing_spans                  Uptrace's metric derived from spans (all traced services)
#     http_server_request_duration (s)       OTel Java agent in coreEngine (http_route, http_response_status_code)
#     audio_processing_runs / _steps         audioProcessing/lib/jobMetrics.ts
#     audio_processing_heartbeats_received   adminBackend core/services/system_health_service.py
#     mail_sent / mail_send_failures / mail_dlq_pushed / mail_queue_length
#                                            workers/mailEvents/telemetry.ts

monitors:
  # ── 1. HTTP 5xx rate 5 minute tak 2% se zyada (har service) ─────────────────
  # Server spans ka status "error" sirf 5xx pe hota hai (4xx pe nahi), isliye
  # httpserver spans ka error ratio = 5xx ratio. Har service_name ke liye alag alert.
  - name: "HTTP 5xx rate > 2% (5m)"
    type: threshold
    metrics:
      - uptrace_tracing_spans as $spans
    query:
      - histogram_count($spans{_status_code="error"}) / histogram_count($spans) as err_rate
      - where _type = "httpserver"
      - where service_name in ("core-engine", "admin-backend")
      - group by service_name
    column:
      name: err_rate
      unit: utilization
    max_value: 0.02
    num_eval_points: 5
    min_breach_points: 5

  # ── 2. Home / recommendation endpoints ki p95 latency 10 min tak 1.5s se zyada ──
  # Routes (coreEngine controllers): GET /api/home/stream (SSE: span poora feed
  # khatam hone tak chalta hai), /api/recommendations/user,
  # /api/recommendations/similar/{songId}, /api/recommendations/radio,
  # /api/recommendations/radio/session.
  - name: "Core home/recommendations p95 > 1.5s (10m)"
    type: threshold
    metrics:
      - http_server_request_duration as $dur
    query:
      - p95($dur) as p95_dur
      - where service_name = "core-engine"
      - where http_route ~ "^/api/(home|recommendations)"
      - group by http_route
    column:
      name: p95_dur
      unit: seconds
    max_value: 1.5
    num_eval_points: 10
    min_breach_points: 10

  # ── 3. Koi bhi audio processing job fail ─────────────────────────────────────
  # outcome="failure" tabhi likha jaata hai jab Inngest ke saare retries khatam ho jaayein.
  - name: "Audio processing job failed"
    type: threshold
    metrics:
      - audio_processing_runs as $runs
    query:
      - sum($runs{outcome="failure"}) as failed_runs
      - group by function
    column:
      name: failed_runs
      unit: "{run}"
    max_value: 0
    num_eval_points: 1
    min_breach_points: 1

  # Saathi alert: koi step baar baar retry ho raha hai (S3 / ImageKit / callback kabhi chalta kabhi nahi)
  # fail hone se pehle hi pata chal jaaye. Kam urgent.
  - name: "Audio processing step retries > 10/min"
    type: threshold
    metrics:
      - audio_processing_steps as $steps
    query:
      - sum($steps{outcome="retry"}) as step_retries
      - group by function, step
    column:
      name: step_retries
      unit: "{step}"
    max_value: 10
    num_eval_points: 1
    min_breach_points: 1

  # ── 4. 3 minute tak audio-processing ka heartbeat nahi aaya ──────────────────
  # audioProcessing har 10 second heartbeat bhejta hai (≈6/minute). `default 0`
  # khaali buckets ko 0 bana deta hai, taaki chuppi (worker down, admin down, auth/network
  # fail) bhi alert de, graph me sirf khaali jagah na bane.
  - name: "No audio-processing heartbeat (3m)"
    type: threshold
    metrics:
      - audio_processing_heartbeats_received as $hb
    query:
      - sum($hb) default 0 as heartbeats
    column:
      name: heartbeats
      unit: "{heartbeat}"
    min_value: 1
    num_eval_points: 3
    min_breach_points: 3

  # ── 5. Mail: DLQ badh rahi hai ya sends fail ho rahe hain ───────────────────
  - name: "Mail moved to DLQ"
    type: threshold
    metrics:
      - mail_dlq_pushed as $dlq
    query:
      - sum($dlq) as dlq_pushed
      - group by reason
    column:
      name: dlq_pushed
      unit: "{email}"
    max_value: 0
    num_eval_points: 1
    min_breach_points: 1

  - name: "Mail send failures > 5/min (5m)"
    type: threshold
    metrics:
      - mail_send_failures as $fail
    query:
      - sum($fail) as send_failures
    column:
      name: send_failures
      unit: "{attempt}"
    max_value: 5
    num_eval_points: 5
    min_breach_points: 5

  - name: "Mail queue backlog > 50 (10m)"
    type: threshold
    metrics:
      - mail_queue_length as $len
    query:
      - max($len{queue!~"_dlq$"}) as backlog
    column:
      name: backlog
      unit: "{job}"
    max_value: 50
    num_eval_points: 10
    min_breach_points: 10

  # ── 6. Restarts / crash loops (andaze se) ────────────────────────────────────
  # Container restart counts collect NAHI hote (collector ke paas Docker
  # socket nahi; README ka "Container restarts" dekho). Ye "chup ho gaya" monitors
  # crash hui ya baar baar crash hoti service pakadte hain.
  # core-engine: Docker HEALTHCHECK har 30 sec /actuator/health hit karta hai → minute me ≥2 spans.
  # admin-backend: heartbeats + /health checks → minute me ≥6 spans.
  - name: "core-engine sent no spans (5m)"
    type: threshold
    metrics:
      - uptrace_tracing_spans as $spans
    query:
      - histogram_count($spans{service_name="core-engine"}) default 0 as spans
    column:
      name: spans
      unit: "{span}"
    min_value: 1
    num_eval_points: 5
    min_breach_points: 5

  - name: "admin-backend sent no spans (5m)"
    type: threshold
    metrics:
      - uptrace_tracing_spans as $spans
    query:
      - histogram_count($spans{service_name="admin-backend"}) default 0 as spans
    column:
      name: spans
      unit: "{span}"
    min_value: 1
    num_eval_points: 5
    min_breach_points: 5

  # mail-worker zinda rehte har 15 sec mail_queue_length bhejta hai.
  - name: "Mail worker silent (5m)"
    type: threshold
    metrics:
      - mail_queue_length as $len
    query:
      - absent($len) as missing
    column:
      name: missing
    max_value: 0
    num_eval_points: 5
    min_breach_points: 5
