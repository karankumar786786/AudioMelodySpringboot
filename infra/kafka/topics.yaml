# Saare Kafka topics. apply-topics.sh inhe lagata hai (redpanda-init container har deploy pe chalata hai;
# sirf missing topics banata hai aur configs update karta hai, kabhi delete nahi karta).
# Must match communication/src/main/java/me/oneorg/melody/events/Topics.java.
#
# Ek hi apna Redpanda node hai, isliye replication factor 1. Managed cluster pe
# script chalate waqt REPLICATION_FACTOR=3 do.
#
# Retention (kitni der data rakhna, ms me): 1 din = 86400000, 3 din = 259200000, 7 din = 604800000,
#            14 din = 1209600000, 90 din = 7776000000. compact = har key ki sirf aakhri value rakho.
topics:
  # Core API ki telemetry
  - name: listening.play.v1
    partitions: 3
    config: retention.ms=604800000
  - name: listening.skip.v1
    partitions: 3
    config: retention.ms=604800000
  - name: search.interaction.v1
    partitions: 3
    config: retention.ms=604800000
  - name: queue.change.v1
    partitions: 3
    config: retention.ms=259200000
  - name: engagement.feedback.v1
    partitions: 3
    config: retention.ms=604800000

  # Outbox se aane wale state changes
  - name: engagement.favourite.v1
    partitions: 3
    config: retention.ms=604800000
  - name: engagement.playlist-song.v1
    partitions: 3
    config: retention.ms=604800000
  - name: social.artist-follow.v1
    partitions: 3
    config: retention.ms=604800000
  - name: user.lifecycle.v1
    partitions: 3
    config: retention.ms=604800000
  - name: catalog.song.v1
    partitions: 3
    config: cleanup.policy=compact
  # Isme OTP hote hain: sirf 1 din rakho.
  - name: notification.email.v1
    partitions: 3
    config: retention.ms=86400000
  - name: notification.email.retry.v1
    partitions: 3
    config: retention.ms=86400000

  # Stream services inhe banati hain
  - name: stats.song.v1
    partitions: 3
    config: cleanup.policy=compact
  - name: stats.artist.v1
    partitions: 3
    config: cleanup.policy=compact
  - name: stats.song-daily.v1
    partitions: 3
    config: retention.ms=7776000000
  - name: activity.session.v1
    partitions: 3
    config: cleanup.policy=compact
  # Song analytics: har second ke heatmap totals, daily totals, streaming quality
  - name: analytics.song-timeline.v1     # har record me sirf badle seconds: compact nahi kar sakte
    partitions: 3
    config: retention.ms=604800000
  - name: analytics.song-daily.v1
    partitions: 3
    config: cleanup.policy=compact
  - name: analytics.song-quality.v1
    partitions: 3
    config: cleanup.policy=compact
  - name: pipeline.dlq.v1
    partitions: 3
    config: retention.ms=1209600000

  # Commit ke baad outboxRelay ko simple "jaago" signal (1 ghanta)
  - name: outbox.wakeup.v1
    partitions: 1
    config: retention.ms=3600000
