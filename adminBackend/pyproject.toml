[project]
name = "admin"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "algoliasearch>=4.47.0",
    "boto3>=1.43.107",
    "dj-database-url>=3.1.2",
    "django>=6.1.1",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.18.1",
    "gunicorn>=26.2.0",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.4",
    "recombee-api-client>=6.3.1",
    "redis>=8.1.0",
]

[tool.pyrefly]
search-path = [
    "admin",
    "admin/core",
    "admin/catalog",
    "admin/accounts",
    "admin/jobs",
    "admin/dashboard",
    "admin/webhooks",
    "admin/api",
]
site-package-path = [
    ".venv/lib/python3.12/site-packages",
]

[tool.pyrefly.errors]
bad-override = false
bad-override-mutable-attribute = false
bad-override-param-name = false

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "pyrefly>=1.4.0",
]
