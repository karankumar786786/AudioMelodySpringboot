<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" role="img" aria-label="One Melody architecture: mobile and web apps call the Core API on the core EC2 server through Caddy; the admin dashboard calls the Admin API on the processing EC2 server. Both APIs share Neon Postgres and Upstash Redis. The Admin API sends job events to Inngest Cloud, which runs steps on the audio processing service; that service reads and writes S3 and reports back by webhook. Apps read Algolia, ImageKit and S3 directly.">
  <title>One Melody system architecture</title>
  <style>
    :root { --bg:#f6f8fb; --fg:#16202b; --muted:#5a6878; --line:#c3ccd7; --panel:#ffffff; --group:#e9eef4; --accent:#1d64d8; --edge:#3d4a59; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0e1319; --fg:#e2e8ef; --muted:#93a0b0; --line:#34404d; --panel:#17202a; --group:#121a23; --accent:#5c9cff; --edge:#a9b6c4; }
    }
    text { font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: var(--fg); }
    .title { font-family: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 22px; font-weight: 600; }
    .subtitle { font-size: 12px; fill: var(--muted); }
    .t { font-family: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 600; }
    .s { font-size: 11px; fill: var(--muted); }
    .h { font-size: 11px; letter-spacing: .08em; fill: var(--muted); }
    .bg { fill: var(--bg); }
    .box { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; }
    .grp { fill: var(--group); stroke: var(--line); stroke-width: 1; }
    .edge { fill: none; stroke: var(--edge); stroke-width: 1.4; }
    .hot { stroke: var(--accent); stroke-width: 1.8; }
    .dash { stroke-dasharray: 6 5; }
    .lbl { font-size: 11px; fill: var(--muted); paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }
    .lbl-g { stroke: var(--group); }
    .lbl-hot { fill: var(--accent); }
    .ah { fill: var(--edge); }
    .ah-hot { fill: var(--accent); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 1 L10 5 L0 9 z"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-hot" d="M0 1 L10 5 L0 9 z"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="860"/>

  <!-- Title -->
  <text class="title" x="40" y="44">One Melody — System Architecture</text>
  <text class="subtitle" x="40" y="66">Two EC2 servers (AWS ap-south-1) behind Caddy · shared Neon Postgres + Upstash Redis · managed search, recommendations, media and jobs</text>

  <!-- Column headers -->
  <text class="h" x="40" y="150">CLIENTS</text>
  <text class="h" x="920" y="114">MANAGED SERVICES</text>

  <!-- Direct client access (dashed bus) -->
  <path class="edge dash" d="M130 172 V100 H1176 V732"/>
  <path class="edge dash" d="M1176 210 H1152" marker-end="url(#a)"/>
  <path class="edge dash" d="M1176 270 H1152" marker-end="url(#a)"/>
  <path class="edge dash" d="M1176 732 H1152" marker-end="url(#a)"/>
  <text class="s" x="653" y="90" text-anchor="middle">direct from mobile &amp; web apps: Algolia search · ImageKit images · S3 audio/video streams</text>

  <!-- ===== Clients ===== -->
  <rect class="box" x="40" y="172" width="180" height="56" rx="6"/>
  <text class="t" x="54" y="196">Mobile app</text>
  <text class="s" x="54" y="214">Expo · React Native</text>

  <rect class="box" x="40" y="256" width="180" height="56" rx="6"/>
  <text class="t" x="54" y="280">Web player</text>
  <text class="s" x="54" y="298">Next.js 16</text>

  <rect class="box" x="40" y="552" width="180" height="56" rx="6"/>
  <text class="t" x="54" y="576">Admin dashboard</text>
  <text class="s" x="54" y="594">Next.js 16</text>

  <!-- ===== EC2 core ===== -->
  <rect class="grp" x="300" y="120" width="460" height="320" rx="8"/>
  <text class="h" x="320" y="146">EC2 · CORE</text>
  <text class="s" x="740" y="146" text-anchor="end">api-one-melody.one-org.me</text>

  <rect class="box" x="340" y="196" width="130" height="64" rx="6"/>
  <text class="t" x="354" y="222">Caddy</text>
  <text class="s" x="354" y="240">TLS proxy :443</text>

  <rect class="box" x="510" y="168" width="230" height="120" rx="6"/>
  <text class="t" x="524" y="194">Core API</text>
  <text class="s" x="524" y="213">Spring Boot 4 · :9090</text>
  <text class="s" x="524" y="231">auth · playback · search</text>
  <text class="s" x="524" y="249">recommendation ranking</text>

  <rect class="box" x="510" y="320" width="230" height="56" rx="6"/>
  <text class="t" x="524" y="344">Mail worker</text>
  <text class="s" x="524" y="362">Bun · reads Redis OTP queue</text>

  <rect class="box" x="340" y="304" width="130" height="56" rx="6"/>
  <text class="t" x="354" y="328">OTel collector</text>
  <text class="s" x="354" y="346">→ Uptrace</text>

  <rect class="box" x="340" y="368" width="130" height="56" rx="6"/>
  <text class="t" x="354" y="392">Watchtower</text>
  <text class="s" x="354" y="410">pulls :latest</text>

  <!-- ===== EC2 processing ===== -->
  <rect class="grp" x="300" y="480" width="460" height="320" rx="8"/>
  <text class="h" x="320" y="506">EC2 · PROCESSING</text>
  <text class="s" x="700" y="506" text-anchor="end">api-admin · audio-processing</text>

  <rect class="box" x="340" y="548" width="130" height="64" rx="6"/>
  <text class="t" x="354" y="574">Caddy</text>
  <text class="s" x="354" y="592">TLS proxy :443</text>

  <rect class="box" x="510" y="528" width="230" height="104" rx="6"/>
  <text class="t" x="524" y="554">Admin API</text>
  <text class="s" x="524" y="573">Django 6 · :8000</text>
  <text class="s" x="524" y="591">catalog · jobs · webhooks</text>
  <text class="s" x="524" y="609">signs S3 + ImageKit uploads</text>

  <rect class="box" x="510" y="680" width="230" height="104" rx="6"/>
  <text class="t" x="524" y="706">Audio processing</text>
  <text class="s" x="524" y="725">Bun · FFmpeg · :5010</text>
  <text class="s" x="524" y="743">transcode HLS · audio features</text>
  <text class="s" x="524" y="761">indexes Algolia + Recombee</text>

  <rect class="box" x="340" y="664" width="130" height="56" rx="6"/>
  <text class="t" x="354" y="688">OTel collector</text>
  <text class="s" x="354" y="706">→ Uptrace</text>

  <rect class="box" x="340" y="728" width="130" height="56" rx="6"/>
  <text class="t" x="354" y="752">Watchtower</text>
  <text class="s" x="354" y="770">pulls :latest</text>

  <!-- ===== Managed services ===== -->
  <rect class="box" x="920" y="124" width="230" height="52" rx="6"/>
  <text class="t" x="934" y="146">Recombee</text>
  <text class="s" x="934" y="164">recommendations</text>

  <rect class="box" x="920" y="184" width="230" height="52" rx="6"/>
  <text class="t" x="934" y="206">Algolia</text>
  <text class="s" x="934" y="224">search index</text>

  <rect class="box" x="920" y="244" width="230" height="52" rx="6"/>
  <text class="t" x="934" y="266">ImageKit</text>
  <text class="s" x="934" y="284">cover art · canvas CDN</text>

  <rect class="box" x="920" y="322" width="230" height="52" rx="6"/>
  <text class="t" x="934" y="344">Gmail SMTP</text>
  <text class="s" x="934" y="362">OTP emails</text>

  <rect class="box" x="920" y="402" width="230" height="52" rx="6"/>
  <text class="t" x="934" y="424">Upstash Redis</text>
  <text class="s" x="934" y="442">sessions · cache · queues</text>

  <rect class="box" x="920" y="472" width="230" height="52" rx="6"/>
  <text class="t" x="934" y="494">Neon Postgres</text>
  <text class="s" x="934" y="512">one DB · Flyway schema</text>

  <rect class="box" x="920" y="590" width="230" height="52" rx="6"/>
  <text class="t" x="934" y="612">Inngest Cloud</text>
  <text class="s" x="934" y="630">runs processing jobs</text>

  <rect class="box" x="920" y="706" width="230" height="52" rx="6"/>
  <text class="t" x="934" y="728">Amazon S3</text>
  <text class="s" x="934" y="746">temp + production buckets</text>

  <!-- ===== Listener request path (blue) ===== -->
  <path class="edge hot" d="M220 200 H280 V228"/>
  <path class="edge hot" d="M220 284 H280 V228"/>
  <path class="edge hot" d="M280 228 H338" marker-end="url(#ah)"/>
  <text class="lbl lbl-hot" x="250" y="192" text-anchor="middle">HTTPS</text>
  <path class="edge hot" d="M470 228 H508" marker-end="url(#ah)"/>

  <!-- ===== Core API → services ===== -->
  <path class="edge" d="M740 186 H800 V150 H918" marker-end="url(#a)"/>
  <text class="lbl" x="859" y="144" text-anchor="middle">recs · events</text>
  <path class="edge" d="M740 210 H918" marker-end="url(#a)"/>
  <text class="lbl" x="829" y="204" text-anchor="middle">index sync</text>
  <path class="edge" d="M740 262 H790 V420 H918" marker-end="url(#a)"/>
  <text class="lbl" x="852" y="413" text-anchor="middle">sessions · OTPs</text>
  <path class="edge" d="M740 276 H770 V490 H918" marker-end="url(#a)"/>
  <text class="lbl" x="815" y="483" text-anchor="middle">SQL</text>
  <!-- mail → SMTP hops over the two core lanes -->
  <path class="edge" d="M740 348 H764 a6 6 0 0 1 12 0 H784 a6 6 0 0 1 12 0 H918" marker-end="url(#a)"/>
  <text class="lbl" x="857" y="342" text-anchor="middle">sends mail</text>

  <!-- ===== Admin side ===== -->
  <path class="edge" d="M220 580 H338" marker-end="url(#a)"/>
  <text class="lbl" x="260" y="572" text-anchor="middle">session</text>
  <path class="edge" d="M470 580 H508" marker-end="url(#a)"/>

  <!-- Admin API → Redis (hops over Core's SQL line) and → Neon -->
  <path class="edge" d="M740 536 H860 V496 a6 6 0 0 0 0 -12 V442 H918" marker-end="url(#a)"/>
  <path class="edge" d="M740 552 H880 V510 H918" marker-end="url(#a)"/>
  <text class="lbl" x="812" y="529" text-anchor="middle">SQL · sessions</text>

  <path class="edge" d="M740 616 H918" marker-end="url(#a)"/>
  <text class="lbl" x="830" y="610" text-anchor="middle">job events</text>
  <path class="edge" d="M920 636 H820 V712 H742" marker-end="url(#a)"/>
  <text class="lbl" x="781" y="706" text-anchor="middle">runs steps</text>
  <path class="edge" d="M740 748 H918" marker-end="url(#a)"/>
  <text class="lbl" x="830" y="742" text-anchor="middle">temp in · HLS out</text>

  <path class="edge" d="M620 680 V634" marker-end="url(#a)"/>
  <text class="lbl lbl-g" x="610" y="661" text-anchor="end">webhooks · heartbeat</text>

  <!-- ===== Legend ===== -->
  <path class="edge hot" d="M40 832 H80"/>
  <text class="s" x="90" y="836">listener request</text>
  <path class="edge" d="M240 832 H280"/>
  <text class="s" x="290" y="836">server-side call</text>
  <path class="edge dash" d="M440 832 H480"/>
  <text class="s" x="490" y="836">app calls the service directly</text>
  <text class="s" x="1150" y="836" text-anchor="end">Deploys: GitHub Actions → Docker Hub → Watchtower</text>
</svg>
