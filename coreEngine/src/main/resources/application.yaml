spring:
  threads:
    virtual:
      enabled: true

  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:coreEngine/.env[.properties]

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:user}
    password: ${MAIL_PASSWORD:pass}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  application:
    name: ${APPLICATION_NAME:melody}
    api-key: ${APPLICATION_API_KEY:default_api_key}

  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: ${DB_URL:jdbc:postgresql://localhost:5432/melody}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    # --- Hikari Connection Pool Config ---
    hikari:
      pool-name: MelodyHikariPool
      # No idle connections: Neon suspends compute only after 5 min without activity, and
      # warm connections (recycled every max-lifetime) kept it awake around the clock, which
      # used up the plan's compute quota. The first query after a quiet spell opens a fresh
      # connection (and may wait for Neon to wake), which is the trade-off.
      minimum-idle: 0
      maximum-pool-size: 20              # allow up to 20 concurrent queries without queuing
      idle-timeout: 60000                # close idle connections after 1 min
      max-lifetime: 240000
      keepalive-time: 0                  # no keepalive pings
      connection-timeout: 10000          # 10s connection timeout
      initialization-fail-timeout: -1    # app can boot even if DB is asleep
      leak-detection-threshold: 30000    # warn if a connection is held > 30s
      # do NOT set connection-test-query

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      mailqueue: ${REDIS_MAIL_QUEUE:mail_queue}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}

  # Event pipeline (Redpanda). Producers connect lazily, so an empty broker list is fine
  # while melody.events.mode is LEGACY.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    admin:
      auto-create: false
    producer:
      acks: all
      compression-type: lz4
      properties:
        enable.idempotence: true
        linger.ms: 5
        max.block.ms: 2000           # never block a request thread long on metadata
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:18081}
      auto.register.schemas: ${SCHEMA_AUTO_REGISTER:true}
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-256}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}

  jpa:
    open-in-view: false                  # don't hold a connection for the whole request
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate                  # consider "none" or "validate" in production
    properties:
      hibernate:
        boot:
          "[allow_jdbc_metadata_access]": false   # skip metadata connection at startup

  jackson:
    deserialization:
      fail-on-null-for-primitives: false
      fail-on-unknown-properties: false

  lifecycle:
    timeout-per-shutdown-phase: 30s

# Spring Cloud AWS: only the 'aws' profile (below) talks to Secrets Manager. Without this,
# its auto-configuration builds a client at start-up and fails where no AWS region is set.
---
spring:
  cloud:
    aws:
      secretsmanager:
        enabled: false
---
# LEGACY (default) | DUAL | KAFKA. See Events/Kafka/EventsMode.java.
melody:
  events:
    mode: ${EVENTS_MODE:LEGACY}
    source: core-api
    produce-timeout: 3s
    max-batch-size: 50
    telemetry-per-user-per-minute: 300
    otp-fallback-after: 30s

jwt:
  secret: ${JWT_SECRET:super_secret_jwt_key_that_is_at_least_32_bytes_long_and_very_secure_12345}

# HttpOnly auth cookies for the web app (see Security/AuthCookies). The mobile app uses bearer tokens.
auth:
  cookie:
    domain: ${COOKIE_DOMAIN:}
    secure: ${COOKIE_SECURE:true}
    same-site: ${COOKIE_SAME_SITE:Lax}
    access-max-age: ${COOKIE_ACCESS_MAX_AGE:3600}
    refresh-max-age: ${COOKIE_REFRESH_MAX_AGE:604800}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://one-melody.one-org.me,https://*.one-org.me}

geoip:
  database-path: ${GEOIP_DATABASE_PATH:}

server:
  port: ${PORT:8080}
  shutdown: graceful

# Actuator: only safe endpoints, and NO database pings
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true                    # /actuator/health/liveness and /readiness
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState        # no db check, so Neon can sleep
  health:
    db:
      enabled: false                     # main culprit: stops "SELECT 1" every few seconds
    mail:
      enabled: false
    diskspace:
      enabled: false
    # redis check is fine to keep: it hits Redis, not Neon

algolia:
  app-id: ${ALGOLIA_APP_ID:default_algolia_app_id}
  api-key: ${ALGOLIA_API_KEY:default_algolia_api_key}
  index-name: ${ALGOLIA_INDEX_NAME:default_algolia_index_name}
  search-api-key: ${ALGOLIA_SEARCH_API_KEY:default_key}

recombee:
  database-id: ${RECOMBEE_DATABASE_ID:default_recombee_db_id}
  secret-token: ${RECOMBEE_DATABASE_SECRET:default_recombee_token}
  region: ${RECOMBEE_DATABASE_REGION:EU_WEST}

logging:
  level:
    root: INFO
    "[org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer]": ERROR
    "[com.zaxxer.hikari]": INFO
    "[me.oneorg.melody]": INFO
    "[org.springframework.web]": INFO
    "[org.hibernate.SQL]": WARN
  pattern:
    console: "%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(%5p) %clr([${spring.application.name:core-engine},%X{trace_id:-0},%X{span_id:-0}]){yellow} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"
---
# Production secrets: AWS Secrets Manager, read with the EC2 instance role (no keys on disk).
# Turn on with SPRING_PROFILES_ACTIVE=aws. SECRET_IDS is a ';'-separated list of JSON secrets
# whose keys (DB_URL, JWT_SECRET, ...) become properties and fill the ${...} placeholders above.
# The import is not optional: if a secret cannot be read the app stops instead of
# starting against the localhost defaults. Without the profile, .env loading works as before.
spring:
  config:
    activate:
      on-profile: aws
    import:
      - aws-secretsmanager:${SECRET_IDS:onemelody/prod/db;onemelody/prod/redis;onemelody/prod/kafka;onemelody/prod/core}
  cloud:
    aws:
      secretsmanager:
        enabled: true
      region:
        static: ${AWS_REGION:ap-south-1}
