spring:

  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:coreEngine/.env[.properties]

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:user}
    password: ${MAIL_PASSWORD:pass}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  application:
    name: ${APPLICATION_NAME:melody}
    api-key: ${APPLICATION_API_KEY:default_api_key}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/melody}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    # --- Neon scale-to-zero friendly pool ---
    hikari:
      minimum-idle: 0                    # no idle connections kept open
      maximum-pool-size: 5
      idle-timeout: 60000                # close idle connections after 1 min
      max-lifetime: 240000
      keepalive-time: 0                  # no keepalive pings
      connection-timeout: 30000          # allow time for Neon cold start
      initialization-fail-timeout: -1    # app can boot even if DB is asleep
      # do NOT set connection-test-query

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      mailqueue: ${REDIS_MAIL_QUEUE:mail_queue}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}

  jpa:
    open-in-view: false                  # don't hold a connection for the whole request
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update                   # consider "none" or "validate" in production
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        temp:
          use_jdbc_metadata_defaults: false   # skip metadata connection at startup

  jackson:
    deserialization:
      fail-on-null-for-primitives: false
      fail-on-unknown-properties: false

  lifecycle:
    timeout-per-shutdown-phase: 30s

jwt:
  secret: ${JWT_SECRET:super_secret_jwt_key_that_is_at_least_32_bytes_long_and_very_secure_12345}

server:
  port: ${PORT:8080}
  shutdown: graceful

# Actuator: only safe endpoints, and NO database pings
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true                    # /actuator/health/liveness and /readiness
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState        # no db check, so Neon can sleep
  health:
    db:
      enabled: false                     # main culprit: stops "SELECT 1" every few seconds
    mail:
      enabled: false
    diskspace:
      enabled: false
    # redis check is fine to keep: it hits Redis, not Neon

# OpenAPI / Swagger configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

algolia:
  app-id: ${ALGOLIA_APP_ID:default_algolia_app_id}
  api-key: ${ALGOLIA_API_KEY:default_algolia_api_key}
  index-name: ${ALGOLIA_INDEX_NAME:default_algolia_index_name}

recombee:
  database-id: ${RECOMBEE_DATABASE_ID:default_recombee_db_id}
  secret-token: ${RECOMBEE_DATABASE_SECRET:default_recombee_token}
  region: ${RECOMBEE_DATABASE_REGION:EU_WEST}