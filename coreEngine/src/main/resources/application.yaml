spring:
  threads:
    virtual:
      enabled: true

  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:coreEngine/.env[.properties]

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:user}
    password: ${MAIL_PASSWORD:pass}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  application:
    name: ${APPLICATION_NAME:melody}
    api-key: ${APPLICATION_API_KEY:default_api_key}

  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: ${DB_URL:jdbc:postgresql://localhost:5432/melody}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    # --- Database connection pool (HikariCP) ki setting ---
    hikari:
      pool-name: MelodyHikariPool
      # Koi idle (khaali padi) connection nahi: Neon database 5 minute bina kaam ke "so" jaata hai.
      # Khuli connections use din-raat jagaye rakhti thin, jisse plan ka compute quota
      # khatam ho jaata tha. Ab der tak khaali rehne ke baad pehli query nayi connection kholti hai
      # (aur Neon ke jaagne ka thoda wait) - ye chhota sa trade-off hai.
      minimum-idle: 0
      maximum-pool-size: 20              # ek saath max 20 queries, line me lage bina
      idle-timeout: 60000                # 1 minute khaali padi connection band
      max-lifetime: 240000
      keepalive-time: 0                  # keepalive ping nahi (Neon ko jagaye rakhte)
      connection-timeout: 10000          # connection 10 second me na mile to error
      initialization-fail-timeout: -1    # DB so raha ho tab bhi app start ho jaaye
      leak-detection-threshold: 30000    # koi connection 30 second se zyada pakde to warning (leak)
      # connection-test-query set MAT karo (JDBC driver khud check kar leta hai)

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      mailqueue: ${REDIS_MAIL_QUEUE:mail_queue}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}

  # Event pipeline (Redpanda / Kafka). Producers pehle message pe hi connect karte hain, isliye
  # LEGACY mode me broker list khaali ho to bhi chalega.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    admin:
      auto-create: false
    producer:
      acks: all
      compression-type: lz4
      properties:
        enable.idempotence: true
        linger.ms: 5
        max.block.ms: 2000           # Kafka metadata ke liye request thread ko 2 second se zyada mat roko
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:18081}
      auto.register.schemas: ${SCHEMA_AUTO_REGISTER:true}
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-256}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}

  jpa:
    open-in-view: false                  # poori request ke dauraan connection pakad ke mat rakho
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate                  # validate = start pe entities ko DB tables se match karo (mismatch = app start nahi hoga)
    properties:
      hibernate:
        boot:
          "[allow_jdbc_metadata_access]": false   # startup pe metadata ke liye extra connection mat kholo

  jackson:
    deserialization:
      fail-on-null-for-primitives: false
      fail-on-unknown-properties: false

  lifecycle:
    timeout-per-shutdown-phase: 30s

# Spring Cloud AWS: sirf 'aws' profile (neeche) Secrets Manager se baat karta hai. Ye na ho to
# startup pe AWS client banta hai aur jahan AWS region set nahi (local) wahan fail ho jaata.
---
spring:
  cloud:
    aws:
      secretsmanager:
        enabled: false
---
# LEGACY (default) | DUAL | KAFKA - kya matlab hai, Events/Kafka/EventsMode.java me dekho.
melody:
  shorts:
    temp-bucket: ${S3_TEMP_BUCKET:audiomelodyspringboottemp}
    region: ${AWS_REGION:ap-south-1}
    max-upload-bytes: ${SHORTS_MAX_UPLOAD_BYTES:104857600}   # 100 MB
    max-uploads-per-day: ${SHORTS_MAX_UPLOADS_PER_DAY:5}
    upload-url-ttl: 15m
    auto-hide-reports: ${SHORTS_AUTO_HIDE_REPORTS:3}
    # Inngest Event API. Production me URL khaali chhodo (Inngest Cloud + event key use hoga);
    # local dev server ke liye http://localhost:8288/e/dev
    inngest-event-url: ${INNGEST_EVENT_URL:}
    inngest-event-key: ${INNGEST_EVENT_KEY:}
  events:
    mode: ${EVENTS_MODE:LEGACY}
    source: core-api
    produce-timeout: 3s
    max-batch-size: 50
    telemetry-per-user-per-minute: 300
    otp-fallback-after: 30s

jwt:
  secret: ${JWT_SECRET:super_secret_jwt_key_that_is_at_least_32_bytes_long_and_very_secure_12345}

# Website ke liye HttpOnly login cookies (Security/AuthCookies dekho). Mobile app bearer token use karta hai.
auth:
  cookie:
    domain: ${COOKIE_DOMAIN:}
    secure: ${COOKIE_SECURE:true}
    same-site: ${COOKIE_SAME_SITE:Lax}
    access-max-age: ${COOKIE_ACCESS_MAX_AGE:3600}
    refresh-max-age: ${COOKIE_REFRESH_MAX_AGE:604800}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://one-melody.one-org.me,https://*.one-org.me}

geoip:
  database-path: ${GEOIP_DATABASE_PATH:}

server:
  port: ${PORT:8080}
  shutdown: graceful

# Actuator (health/info): sirf safe endpoints, aur database ping NAHI (warna Neon kabhi nahi soyega)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true                    # /actuator/health/liveness aur /readiness
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState        # DB check nahi, taaki Neon so sake
  health:
    db:
      enabled: false                     # asli wajah: har kuch second me "SELECT 1" band karta hai
    mail:
      enabled: false
    diskspace:
      enabled: false
    # Redis ka health check rakh sakte hain: ye Redis ko chhoota hai, Neon ko nahi

algolia:
  app-id: ${ALGOLIA_APP_ID:default_algolia_app_id}
  api-key: ${ALGOLIA_API_KEY:default_algolia_api_key}
  index-name: ${ALGOLIA_INDEX_NAME:default_algolia_index_name}
  search-api-key: ${ALGOLIA_SEARCH_API_KEY:default_key}

recombee:
  database-id: ${RECOMBEE_DATABASE_ID:default_recombee_db_id}
  secret-token: ${RECOMBEE_DATABASE_SECRET:default_recombee_token}
  region: ${RECOMBEE_DATABASE_REGION:EU_WEST}

logging:
  level:
    root: INFO
    "[org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer]": ERROR
    "[com.zaxxer.hikari]": INFO
    "[me.oneorg.melody]": INFO
    "[org.springframework.web]": INFO
    "[org.hibernate.SQL]": WARN
  pattern:
    console: "%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(%5p) %clr([${spring.application.name:core-engine},%X{trace_id:-0},%X{span_id:-0}]){yellow} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"
---
# Production secrets: AWS Secrets Manager se, EC2 instance role ke through (disk pe koi key nahi).
# SPRING_PROFILES_ACTIVE=aws se on hota hai. SECRET_IDS = ';' se alag JSON secrets ki list,
# jinki keys (DB_URL, JWT_SECRET, ...) properties ban ke upar ke ${...} bhar deti hain.
# Ye import zaroori hai: koi secret padh na paaye to app band ho jaata hai, taaki
# galti se localhost defaults ke saath na chal jaaye. Profile ke bina .env file pehle jaisi chalti hai.
spring:
  config:
    activate:
      on-profile: aws
    import:
      - aws-secretsmanager:${SECRET_IDS:onemelody/prod/db;onemelody/prod/redis;onemelody/prod/kafka;onemelody/prod/core}
  cloud:
    aws:
      secretsmanager:
        enabled: true
      region:
        static: ${AWS_REGION:ap-south-1}
