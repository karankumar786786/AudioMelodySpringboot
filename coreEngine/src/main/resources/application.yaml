spring:

  cloud:
    openfeign:
      client:
        config:
          audioProcessingApi:
            # retryer: feign.Retryer.Default
            # max-attempts: 3
            # period: 100
            # max-period: 1000

  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:coreEngine/.env[.properties]

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:user}
    password: ${MAIL_PASSWORD:pass}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  application:
    name: ${APPLICATION_NAME:melody}
    api-key: ${APPLICATION_API_KEY:default_api_key}
    admin:
      id: ${ADMIN_ID:default_admin_id}
      name: ${ADMIN_NAME:default_admin_name}
      email: ${ADMIN_EMAIL:admin@melody.com}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/melody}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      mailqueue: ${REDIS_MAIL_QUEUE:mail_queue}
      audioprocessingqueue: ${REDIS_AUDIO_PROCESSING_QUEUE:audio_processing_queue}
      deletequeue: ${REDIS_DELETE_QUEUE:delete_event_queue}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    deserialization:
      fail-on-null-for-primitives: false
      fail-on-unknown-properties: false

jwt:
  secret: ${JWT_SECRET:super_secret_jwt_key_that_is_at_least_32_bytes_long_and_very_secure_12345}
server:
  port: ${PORT:8080}

algolia:
  app-id: ${ALGOLIA_APP_ID:default_algolia_app_id}
  api-key: ${ALGOLIA_API_KEY:default_algolia_api_key}
  index-name: ${ALGOLIA_INDEX_NAME:default_algolia_index_name}

recombee:
  database-id: ${RECOMBEE_DATABASE_ID:default_recombee_db_id}
  secret-token: ${RECOMBEE_DATABASE_SECRET:default_recombee_token}
  region: ${RECOMBEE_DATABASE_REGION:EU_WEST}

aws:
  accesskeyid: ${AWS_ACCESS_KEY_ID:default_access_key}
  secretkey: ${AWS_SECRET_ACCESS_KEY:default_secret_key}
  region: ${AWS_REGION:ap-south-1}
  endpoint: ${AWS_ENDPOINT:}

s3:
  temp-bucket: ${S3_TEMP_BUCKET:melody-temp}
  production-bucket: ${S3_PRODUCTION_BUCKET:melody-songs}
  temp-url-validity-min: 30

audio-processing:
    api:
      key: ${AUDIO_PROCESSING_API_KEY:default_audio_processing_key}
      url: ${AUDIO_PROCESSING_URL:http://localhost:8000}

imagekit:
  public-key: ${IMAGEKIT_PUBLIC_KEY:default_public_key}
  private-key: ${IMAGEKIT_PRIVATE_KEY:default_private_key}
  url-endpoint: ${IMAGEKIT_URL_ENDPOINT:https://ik.imagekit.io/default}

