spring:

  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:coreEngine/.env[.properties]

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:user}
    password: ${MAIL_PASSWORD:pass}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  application:
    name: ${APPLICATION_NAME:melody}
    api-key: ${APPLICATION_API_KEY:default_api_key}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/melody}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      mailqueue: ${REDIS_MAIL_QUEUE:mail_queue}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    deserialization:
      fail-on-null-for-primitives: false
      fail-on-unknown-properties: false

jwt:
  secret: ${JWT_SECRET:super_secret_jwt_key_that_is_at_least_32_bytes_long_and_very_secure_12345}
server:
  port: ${PORT:8080}
  shutdown: graceful

spring.lifecycle:
  timeout-per-shutdown-phase: 30s

# Actuator endpoint protection — only expose safe endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  health:
    mail:
      enabled: false

# OpenAPI / Swagger configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

algolia:
  app-id: ${ALGOLIA_APP_ID:default_algolia_app_id}
  api-key: ${ALGOLIA_API_KEY:default_algolia_api_key}
  index-name: ${ALGOLIA_INDEX_NAME:default_algolia_index_name}

recombee:
  database-id: ${RECOMBEE_DATABASE_ID:default_recombee_db_id}
  secret-token: ${RECOMBEE_DATABASE_SECRET:default_recombee_token}
  region: ${RECOMBEE_DATABASE_REGION:EU_WEST}
