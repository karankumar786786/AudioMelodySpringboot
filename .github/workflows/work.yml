name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Cancel redundant in-progress workflow runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 0. Path Filtering & Change Detection
  # =========================================================================
  changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      admin: ${{ steps.filter.outputs.admin }}
      audioprocessing: ${{ steps.filter.outputs.audioprocessing }}
      mail: ${{ steps.filter.outputs.mail }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Detect File Changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            core:
              - 'coreEngine/**'
              - '.github/workflows/work.yml'
            admin:
              - 'adminBackend/**'
              - '.github/workflows/work.yml'
            audioprocessing:
              - 'audioProcessing/**'
              - '.github/workflows/work.yml'
            mail:
              - 'workers/mailEvents/**'
              - '.github/workflows/work.yml'

  # =========================================================================
  # 1. Core Engine Tests (Spring Boot / Java 21)
  # =========================================================================
  test-core:
    name: Test Core Engine
    needs: changes
    if: needs.changes.outputs.core == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        run: chmod +x coreEngine/mvnw

      - name: Run Spring Boot Unit & Integration Tests
        working-directory: ./coreEngine
        run: ./mvnw test --batch-mode --no-transfer-progress

      - name: Upload Core Engine Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-engine-test-reports
          path: coreEngine/target/surefire-reports/
          retention-days: 7

  # =========================================================================
  # 2. Admin Backend Tests (Django / Python 3.12 / uv)
  # =========================================================================
  test-admin:
    name: Test Admin Backend
    needs: changes
    if: needs.changes.outputs.admin == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Install Dependencies
        working-directory: ./adminBackend
        run: uv sync --frozen

      - name: Validate Django Configuration
        working-directory: ./adminBackend/admin
        run: uv run python manage.py check

      - name: Run Django Test Suite
        working-directory: ./adminBackend/admin
        run: uv run python manage.py test

  # =========================================================================
  # 3. Audio Processing Tests (Bun / FFmpeg & Shaka Packager)
  # =========================================================================
  test-audio:
    name: Test Audio Processing
    needs: changes
    if: needs.changes.outputs.audioprocessing == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg & Media Dependencies (FFmpeg & Shaka Packager)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg curl ca-certificates
          ARCH=$(dpkg --print-architecture)
          if [ "$ARCH" = "arm64" ]; then
            PACKAGER_ARCH="arm64"
          else
            PACKAGER_ARCH="x64"
          fi
          sudo curl -fsSL "https://github.com/shaka-project/shaka-packager/releases/download/v3.9.3/packager-linux-${PACKAGER_ARCH}" -o /usr/local/bin/packager
          sudo chmod +x /usr/local/bin/packager
          ffmpeg -version
          packager --version

      - name: Set up Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        working-directory: ./audioProcessing
        run: bun install --frozen-lockfile

      - name: Run Bun Unit Tests
        working-directory: ./audioProcessing
        run: bun run test

  # =========================================================================
  # 4. Mail Worker Validation (Bun)
  # =========================================================================
  test-mail:
    name: Validate Mail Worker
    needs: changes
    if: needs.changes.outputs.mail == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies & Verify Build
        working-directory: ./workers/mailEvents
        run: |
          bun install --frozen-lockfile
          bun run build

  # =========================================================================
  # 5. Selective Docker Build & Push (Only rebuilt when service files change)
  # =========================================================================
  build-core:
    name: Docker Build & Push (core)
    needs: [changes, test-core]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && (needs.changes.outputs.core == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract Docker Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/core
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Build and Push Core Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./coreEngine
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=core
          cache-to: type=gha,mode=max,scope=core

  build-admin:
    name: Docker Build & Push (admin)
    needs: [changes, test-admin]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && (needs.changes.outputs.admin == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract Docker Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/admin
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Build and Push Admin Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./adminBackend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

  build-audioprocessing:
    name: Docker Build & Push (audioprocessing)
    needs: [changes, test-audio]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && (needs.changes.outputs.audioprocessing == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract Docker Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/audioprocessing
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Build and Push Audio Processing Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./audioProcessing
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=audioprocessing
          cache-to: type=gha,mode=max,scope=audioprocessing

  build-mail:
    name: Docker Build & Push (mail)
    needs: [changes, test-mail]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && (needs.changes.outputs.mail == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract Docker Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/mail
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Build and Push Mail Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./workers/mailEvents
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=mail
          cache-to: type=gha,mode=max,scope=mail
