name: CI CD

on:
  push:
    branches:
      - main


jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Build Core
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/coreengine:v1 \
            ./coreEngine
      - name: Push Core
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/coreengine:v1
      - name: Build Mail
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/mail:v1 \
            ./workers/mailEvents
      - name: Push Mail
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/mail:v1
      - name: Build Frontend
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/audiofrontend:v1 \
            ./audioFrontend
      - name: Push Frontend
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/audiofrontend:v1