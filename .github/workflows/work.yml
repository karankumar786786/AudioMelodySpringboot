name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel redundant in-progress workflow runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. Core Engine Tests (Spring Boot / Java 21)
  # =========================================================================
  test-core:
    name: Test Core Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        run: chmod +x coreEngine/mvnw

      - name: Run Spring Boot Unit & Integration Tests
        working-directory: ./coreEngine
        run: ./mvnw test --batch-mode --no-transfer-progress

      - name: Upload Core Engine Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-engine-test-reports
          path: coreEngine/target/surefire-reports/
          retention-days: 7

  # =========================================================================
  # 2. Admin Backend Tests (Django / Python 3.12 / uv)
  # =========================================================================
  test-admin:
    name: Test Admin Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Install Dependencies
        working-directory: ./adminBackend
        run: uv sync --frozen

      - name: Validate Django Configuration
        working-directory: ./adminBackend/admin
        run: uv run python manage.py check

      - name: Run Django Test Suite
        working-directory: ./adminBackend/admin
        run: uv run python manage.py test

  # =========================================================================
  # 3. Audio Processing Tests (Bun / FFmpeg)
  # =========================================================================
  test-audio:
    name: Test Audio Processing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg & Media Dependencies (FFmpeg & Shaka Packager)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg curl ca-certificates
          ARCH=$(dpkg --print-architecture)
          if [ "$ARCH" = "arm64" ]; then
            PACKAGER_ARCH="arm64"
          else
            PACKAGER_ARCH="x64"
          fi
          sudo curl -fsSL "https://github.com/shaka-project/shaka-packager/releases/download/v3.9.3/packager-linux-${PACKAGER_ARCH}" -o /usr/local/bin/packager
          sudo chmod +x /usr/local/bin/packager
          ffmpeg -version
          packager --version


      - name: Set up Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        working-directory: ./audioProcessing
        run: bun install --frozen-lockfile

      - name: Run Bun Unit Tests
        working-directory: ./audioProcessing
        run: bun run test

  # =========================================================================
  # 4. Multi-Service Parallel Docker Build & Push (Runs ONLY after all tests pass)
  # =========================================================================
  build-and-push:
    name: Docker Build & Push (${{ matrix.service }})
    needs: [test-core, test-admin, test-audio]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: core
            context: ./coreEngine
            image_name: core
          - service: mail
            context: ./workers/mailEvents
            image_name: mail
          - service: audioprocessing
            context: ./audioProcessing
            image_name: audioprocessing
          - service: admin
            context: ./adminBackend
            image_name: admin

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract Docker Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image_name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
