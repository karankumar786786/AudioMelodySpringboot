services:
  core:
    image: coreengine:v1
    container_name: core
    restart: unless-stopped
    ports:
      - "9090:9090"
    env_file:
      - core.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - app

  audioprocessing:
    image: audioprocessing:v1
    container_name: audioprocessing
    restart: unless-stopped
    ports:
      - "5010:5010"
    env_file:
      - audioprocessing.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - app

  mail:
    image: mail:v1
    container_name: mail
    restart: unless-stopped
    env_file:
      - mail.env
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - app

  frontend:
    image: audiofrontend:v1
    container_name: audiofrontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - frontend.env
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - app

  adminfrontend:
    image: adminfrontend:v1
    container_name: adminfrontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - adminfrontend.env
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - app

networks:
  app: