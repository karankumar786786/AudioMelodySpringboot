services:
  admin:
    image: karankumar9955/admin:latest
    container_name: admin
    pull_policy: always
    restart: unless-stopped
    env_file:
      - admin.env
    expose:
      - "8000"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - app

  process:
    image: karankumar9955/audioprocessing:latest
    container_name: process
    pull_policy: always
    restart: unless-stopped
    env_file:
      - process.env
    expose:
      - "5010"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - app

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    networks:
      - app

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    env_file:
      - watchtower.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    networks:
      - app

networks:
  app:

volumes:
  caddy_data:
  caddy_config: