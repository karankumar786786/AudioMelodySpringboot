services:
  core:
    image: karankumar9955/core:latest
    container_name: core
    pull_policy: always
    restart: unless-stopped
    env_file:
      - core.env
    expose:
      - "9090"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - app

  mail:
    image: karankumar9955/mail:latest
    container_name: mail
    pull_policy: always
    restart: unless-stopped
    env_file:
      - mail.env
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - app

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    networks:
      - app

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    env_file:
      - watchtower.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    networks:
      - app

networks:
  app:

volumes:
  caddy_data:
  caddy_config: